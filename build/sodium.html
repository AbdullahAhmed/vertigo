// ---------------------------------------------------------------- deterministic pattern per ascent
function hash(i, s) { let h = (i * 374761393 + s * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

// slab flags for a given ascent: gaps (missing) and crumble slabs
function buildPattern(ascent) {
  const n = LAYOUT.slabs.length, gap = new Array(n).fill(false), crumble = new Array(n).fill(false);
  const laps = Math.floor(n / 16);
  const cfg = { 1: { gapFrom: 2, gaps: 1, crFrom: 5, crs: 1 }, 2: { gapFrom: 1, gaps: 2, crFrom: 2, crs: 2 }, 3: { gapFrom: 1, gaps: 2, crFrom: 1, crs: 3 } }[ascent] || { gapFrom: 1, gaps: 3, crFrom: 1, crs: 3 };
  for (let lap = 1; lap < laps; lap++) {
    // candidates: positions 1..3 on each wall except the slab right after a landing; keep the last 6 slabs clean
    let cands = [];
    for (let k = 1; k < 16; k++) { const i = lap * 16 + k; if (k === 1 || i >= n - 10) continue; cands.push(i); }
    cands.sort((a, b) => hash(a, ascent * 7 + 1) - hash(b, ascent * 7 + 1));
    const ok = i => !gap[i] && !crumble[i] && !gap[i - 1] && !gap[i + 1] && !crumble[i - 1] && !crumble[i + 1];
    let g = 0, c = 0;
    for (const i of cands) {
      if (lap >= cfg.gapFrom && g < cfg.gaps && ok(i)) { gap[i] = true; g++; continue; }
      if (lap >= cfg.crFrom && c < cfg.crs && ok(i) && (i % 4) !== 3) { crumble[i] = true; c++; }
    }
    // ascent 3: a crumble slab right before a gap, once per lap — commit before it goes
    if (ascent >= 3) for (const i of cands) if (gap[i] && !crumble[i - 1] && !gap[i - 1] && (i - 1) % 16 !== 0 && (i - 1) % 16 !== 1) { crumble[i - 1] = true; break; }
  }
  return { gap, crumble };
}

// ---------------------------------------------------------------- game state
const G = {
  state: 'loading', ascent: 1, lookEnabled: false, t: 0, falls: 0, startTime: 0, msgT: 0, hintT: 0, lastNote: -1,
  lightsOut: 0, mastDone: false, gust: { t: 0, phase: 0, dir: new THREE.Vector3(), next: 14 }, roofSaid: false, doorSaid: false, heartT: 0,
  intro: null, cine: null, totalClimb: 0,
  say(text, dur = 4.5, note = false) { const m = $('msg'); m.textContent = text; m.className = note ? 'note' : ''; m.style.opacity = 1; this.msgT = dur; },
  hint(text) { const h = $('hint'); h.textContent = text; h.style.opacity = text ? 1 : 0; },
  fade(v) { $('fade').style.opacity = v; },
  setupAscent(n) {
    this.ascent = n;
    const pat = buildPattern(n);
    SL.forEach((s, i) => { const st = slabState[i]; st.gone = pat.gap[i]; st.fallY = st.gone ? -1e6 : 0; st.crumble = pat.crumble[i]; st.timer = 0; st.shake = 0; st.respawn = 0; placeSlab(i);
      slabMesh.setColorAt(i, st.crumble ? C_CRUMBLE : (s.landing ? C_LANDING : C_STONE)); });
    slabMesh.instanceMatrix.needsUpdate = true; slabMesh.instanceColor.needsUpdate = true;
    rebuildSolids();
    // notes
    for (const m of noteMeshes) tower.remove(m); noteMeshes.length = 0;
    const notes = LINES.notes[n] || {};
    for (const lap in notes) { const s = SL[lap * 16]; const m = new THREE.Mesh(noteGeo, noteMat);
      m.position.set(s.x + s.inward[0] * 0.2 + (s.angle === 0 ? 0.6 : 0), s.top + 0.004, -s.y - s.inward[1] * 0.2 + (s.angle === 0 ? 0 : 0.6));
      m.rotation.y = hash(lap, 99) * 0.6; m.userData.text = notes[lap]; m.userData.lap = +lap; tower.add(m); noteMeshes.push(m); }
    // lamps: ascent 3 loses every other one
    for (const l of lampSpots) { l.on = !(n >= 3 && l.lap % 2 === 1); l.mesh.material = l.on ? lampMat : lampMatOff; }
    scene.fog.density = n >= 3 ? 0.0034 : 0.0026;
    // player at the base, looking up (the opening shot)
    P.place(SHOT.x, 0, SHOT.z, SHOT.yaw, SHOT.pitch); P.roll = SHOT.roll; P.nerve = 1;
    P.checkpoint = { x: SHOT.x, y: 0, z: SHOT.z, yaw: SHOT.yaw };
    this.lightsOut = 0; this.mastDone = false; this.roofSaid = false; this.doorSaid = false; this.lastNote = -1; this.gust.phase = 0; this.gust.next = 14;
    lampsMesh.material = MATS.lamps; MATS.lamps.color.set(0xfff6dc);
    this.lookEnabled = false;
    this.intro = { t: 0, lines: LINES.start[n] || LINES.start[3], li: 0 };
  },
  begin() {
    if (this.state !== 'title') return;
    Audio.init(); Audio.ctx.resume();
    $('title').style.opacity = 0; setTimeout(() => $('title').style.display = 'none', 1300);
    grabPointer();
    this.state = 'play'; this.startTime = performance.now();
    for (const id of ['reticle', 'alt', 'nerve', 'nervelbl']) $(id).classList.remove('hidden');
    this.intro.t = 0.001;
  },
  respawn(kind) {
    this.state = 'dead'; this.fade(1); Audio.thud();
    this.say(LINES.fall[Math.min(this.falls, 2)], 4);
    setTimeout(() => {
      const c = P.checkpoint; P.place(c.x, c.y + 0.02, c.z, c.yaw, 0.1); P.nerve = 0.8;
      rebuildSolids(); this.state = 'play'; this.fade(0);
    }, 1600);
  },
  use() {
    if (this.state !== 'play' || this.ascent < 3 || !this.nearMast()) return;
    if (this.lightsOut >= 3) return;
    this.lightsOut++; Audio.off();
    const cols = [0xfff6dc, 0xa89f8f, 0x4a4540, 0x0a0a0a];
    MATS.lamps.color.set(cols[this.lightsOut]);
    this.say(['', 'One.', 'Two.', 'Three.'][this.lightsOut], 2.5);
    if (this.lightsOut === 3) { this.hint(''); this.mastDone = true; this.cine = { t: 0, kind: 'end' }; }
  },
  nearMast() { const [mx, my] = LAYOUT.mast; return P.pos.y > TOWER_H - 1 && Math.hypot(P.pos.x - mx, P.pos.z + my) < 2.4; },
  nextAscent() { this.setupAscent(this.ascent + 1); this.fade(1); setTimeout(() => { this.fade(0); this.intro.t = 0.001; this.state = 'play'; }, 1400); },
};

// ---------------------------------------------------------------- update
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), move = new THREE.Vector3(), tmp = new THREE.Vector3();
let lastTime = performance.now(), vertigo = 0, vertigoS = 0, shakeT = 0;

function updatePlayer(dt) {
  // input
  fwd.set(-Math.sin(P.yaw), 0, -Math.cos(P.yaw)); right.set(Math.cos(P.yaw), 0, -Math.sin(P.yaw));
  move.set(0, 0, 0);
  const canMove = G.lookEnabled && locked && !G.cine;
  if (canMove) {
    if (keys.KeyW || keys.ArrowUp) move.add(fwd); if (keys.KeyS || keys.ArrowDown) move.sub(fwd);
    if (keys.KeyD || keys.ArrowRight) move.add(right); if (keys.KeyA || keys.ArrowLeft) move.sub(right);
  }
  const creep = keys.ShiftLeft || keys.ShiftRight;
  const speed = creep ? 1.7 : 4.2;
  if (move.lengthSq() > 0) move.normalize().multiplyScalar(speed);
  // horizontal velocity: instant on ground, 55% control in the air
  if (P.grounded) { P.vel.x = move.x; P.vel.z = move.z; }
  else { P.vel.x = lerp(P.vel.x, move.x, 0.55 * dt * 4); P.vel.z = lerp(P.vel.z, move.z, 0.55 * dt * 4); }
  if (canMove && (keys.Space) && P.grounded) { P.vel.y = 5.4; P.grounded = false; P.fallStart = P.pos.y; Audio.step(true); }
  // gravity
  P.vel.y -= 12 * dt; if (P.vel.y < -40) P.vel.y = -40;
  // stumble / wind
  if (P.stumbleT > 0) { P.stumbleT -= dt; }
  // integrate, axis by axis against the walls
  const wx = P.vel.x + P.wind.x + (P.stumbleT > 0 ? P.stumble.x : 0), wz = P.vel.z + P.wind.z + (P.stumbleT > 0 ? P.stumble.z : 0);
  let nx = P.pos.x + wx * dt; if (isFree(nx, P.pos.z, P.pos.y)) P.pos.x = nx;
  let nz = P.pos.z + wz * dt; if (isFree(P.pos.x, nz, P.pos.y)) P.pos.z = nz;
  pushOutSolids(P.pos);
  if (!isFree(P.pos.x, P.pos.z, P.pos.y)) { // pushed into a wall by a solid: back off toward shaft center
    const l = Math.hypot(P.pos.x, P.pos.z) || 1; P.pos.x -= P.pos.x / l * 0.05; P.pos.z -= P.pos.z / l * 0.05;
  }
  P.pos.y += P.vel.y * dt;
  // ground
  const g = groundAt(P.pos.x, P.pos.z, P.pos.y);
  const wasGrounded = P.grounded;
  if (P.vel.y <= 0 && g.y > -Infinity && P.pos.y <= g.y + 0.02) {
    if (!wasGrounded) { // landed
      const fell = P.fallStart - g.y;
      if (fell > 5.5) { G.falls++; G.respawn(); return; }
      if (fell > 1.2) Audio.step(true);
    }
    P.pos.y = g.y; P.vel.y = 0; P.grounded = true; P.groundRef = g.ref;
  } else {
    if (wasGrounded) P.fallStart = P.pos.y;
    P.grounded = false; P.groundRef = null;
  }
  // footsteps
  if (P.grounded && (Math.abs(wx) + Math.abs(wz)) > 0.3) { P.stepAcc += Math.hypot(wx, wz) * dt; if (P.stepAcc > (creep ? 0.6 : 0.85)) { P.stepAcc = 0; Audio.step(false); } }
  // zones
  P.inside = Math.abs(P.pos.x) < A + 0.2 && Math.abs(P.pos.z) < A + 0.2 && P.pos.y < TOWER_H - 0.5;
  P.onRoof = P.pos.y >= TOWER_H - 0.5 && Math.abs(P.pos.x) < B + 1 && Math.abs(P.pos.z) < B + 1;
  // checkpoints (landings) + crumble slabs
  if (P.groundRef && P.groundRef.slab !== undefined) {
    const i = P.groundRef.slab, s = SL[i], st = slabState[i];
    if (s.landing) { P.checkpoint = { x: s.x, y: s.top, z: -s.y, yaw: P.yaw }; }
    if (st.crumble && !st.gone) { if (st.timer === 0) Audio.crack(); st.timer += dt; st.shake = Math.min(1, st.timer / 0.9); }
  }
  if (P.onRoof) P.checkpoint = { x: 1.5, y: TOWER_H, z: 1.5, yaw: P.yaw };
}

function updateSlabs(dt) {
  let dirty = false, changed = false;
  slabState.forEach((st, i) => {
    if (!st.crumble) return;
    if (!st.gone && st.timer > 0) {
      if (st.timer > 0.95) { st.gone = true; st.fallV = 0; st.fallY = 0; st.respawn = 9; st.shake = 0; Audio.rumble(); changed = true; }
      else if (P.groundRef?.slab !== i) { st.timer = Math.max(0, st.timer - dt * 0.5); st.shake = st.timer / 0.9; }
      dirty = true; placeSlab(i);
    } else if (st.gone && st.fallY > -1e5) {
      st.fallV += 12 * dt; st.fallY += st.fallV * dt; dirty = true;
      if (st.fallY > SL[i].top + 2) st.fallY = -1e6;
      placeSlab(i);
    }
    if (st.gone && st.respawn > 0) { st.respawn -= dt; if (st.respawn <= 0) { st.gone = false; st.fallY = 0; st.timer = 0; st.shake = 0; changed = true; dirty = true; placeSlab(i); } }
  });
  if (dirty) slabMesh.instanceMatrix.needsUpdate = true;
  if (changed) rebuildSolids();
}

function updateVertigo(dt) {
  // how much open air is in front of and below the player
  let v = 0;
  if (G.lookEnabled && (P.inside || P.onRoof) && P.pos.y > 4) {
    const look = Math.max(0, -P.pitch - 0.25) / 1.3;   // 0 .. 1 as you look down
    tmp.set(-Math.sin(P.yaw), 0, -Math.cos(P.yaw)).multiplyScalar(0.75).add(P.pos);
    const gh = groundAt(tmp.x, tmp.z, P.pos.y, 0.05).y;
    const drop = P.pos.y - (gh > -Infinity ? gh : 0);
    const edge = clamp((drop - 1.5) / 12, 0, 1);
    v = look * Math.max(edge, P.grounded ? 0 : 0.6) * clamp((P.pos.y - 4) / 20, 0, 1);
  }
  vertigo = v; vertigoS = lerp(vertigoS, v, 1 - Math.exp(-dt * 3));
  // nerve
  if (v > 0.05) P.nerve -= dt * (0.11 + 0.22 * v) * (1 + 0.25 * (G.ascent - 1));
  else if (P.pitch > -0.15 || !P.inside) P.nerve += dt * 0.12;
  P.nerve = clamp(P.nerve, 0, 1);
  if (P.nerve <= 0 && P.stumbleT <= 0 && P.grounded && G.state === 'play') {
    // knees go. a small push, in a random direction — usually towards the void, because that is where you were looking
    const a = P.yaw + Math.PI + (Math.random() - 0.5) * 1.2;
    P.stumble.set(-Math.sin(a), 0, -Math.cos(a)).multiplyScalar(1.6); P.stumbleT = 0.45; P.nerve = 0.3; Audio.thud();
    G.say("Breathe. Look at the wall.", 3.5);
  }
  if (P.nerve < 0.5 && G.state === 'play') { G.heartT -= dt; if (G.heartT <= 0) { Audio.heartbeat(); G.heartT = lerp(0.55, 1.05, P.nerve * 2); } }
}

function updateGusts(dt) {
  const g = G.gust;
  if (G.ascent < 2 || !P.inside || P.pos.y < 8 || G.state !== 'play') { P.wind.multiplyScalar(Math.max(0, 1 - dt * 3)); return; }
  g.next -= dt;
  if (g.phase === 0 && g.next <= 0) { g.phase = 1; g.t = 0; // pick a direction: from the wall you are on, into the void
    const s = P.groundRef?.slab !== undefined ? SL[P.groundRef.slab] : null;
    if (s) g.dir.set(s.inward[0], 0, -s.inward[1]); else g.dir.set(-Math.sin(P.yaw), 0, -Math.cos(P.yaw));
    g.dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), (Math.random() - 0.5) * 0.8);
    $('wind').style.opacity = 0.8; }
  if (g.phase === 1) { g.t += dt; if (g.t > 1.1) { g.phase = 2; g.t = 0; } }
  if (g.phase === 2) { g.t += dt; const str = G.ascent >= 3 ? 2.3 : 1.7; const env = Math.sin(Math.min(1, g.t / 2.6) * Math.PI);
    P.wind.copy(g.dir).multiplyScalar(str * env);
    if (g.t > 2.6) { g.phase = 0; g.next = 11 + Math.random() * 9 - (G.ascent - 2) * 3; $('wind').style.opacity = 0; P.wind.set(0, 0, 0); } }
}

function updateNarrative(dt) {
  if (G.msgT > 0) { G.msgT -= dt; if (G.msgT <= 0) $('msg').style.opacity = 0; }
  // intro: hold the shot, roll levels out, then hand over the camera
  if (G.intro && G.intro.t > 0) {
    const I = G.intro; I.t += dt;
    const k = smooth(clamp((I.t - 1.0) / 3.5, 0, 1));
    P.roll = lerp(SHOT.roll, 0, k);
    if (I.t > 1.2 && I.li === 0) { G.say(I.lines[0], 4.2); I.li = 1; }
    if (I.t > 6.0 && I.li === 1 && I.lines[1]) { G.say(I.lines[1], 4.2); I.li = 2; }
    if (I.t > 10.5 && I.li === 2 && I.lines[2]) { if (!P.inside) G.say(I.lines[2], 4); I.li = 3; }
    if (I.t > 4.5) G.lookEnabled = true;
    if (I.t > 12) G.intro = null;
  }
  if (P.inside && !G.doorSaid && P.pos.y < 1) { G.doorSaid = true; G.say("Stairs. No railing.", 3.5); }
  if (P.onRoof && !G.roofSaid) { G.roofSaid = true; G.say(LINES.roof[G.ascent] || LINES.roof[3], 4.5); }
  // notes
  for (const m of noteMeshes) { if (m.userData.lap !== G.lastNote && P.pos.distanceTo(m.position) < 1.4) { G.lastNote = m.userData.lap; G.say(m.userData.text, 6, true); } }
  // mast
  if (P.onRoof && G.nearMast() && !G.mastDone) {
    if (G.ascent < 3) { G.mastDone = true; G.cine = { t: 0, kind: 'flare' }; Audio.flare(); }
    else G.hint(G.lightsOut < 3 ? 'E — put it out' : '');
  } else if (G.ascent >= 3 && !G.mastDone) G.hint('');
  // cinematics
  if (G.cine) {
    const c = G.cine; c.t += dt;
    if (c.kind === 'flare') {
      const k = clamp(c.t / 2.5, 0, 1); MATS.lamps.color.setRGB(1, 0.96 + 0.04 * k, 0.86 + 0.14 * k);
      if (c.t > 0.6 && !c.said) { c.said = true; G.say(LINES.mast[G.ascent][0], 5); }
      if (c.t > 3.0) G.fade(1);
      if (c.t > 5.2) { G.cine = null; G.nextAscent(); }
    } else if (c.kind === 'end') {
      if (c.t > 1.2 && !c.said) { c.said = true; G.say("There.", 3); }
      if (c.t > 4.2 && !c.said2) { c.said2 = true; G.say("Now nobody has to look up.", 5); }
      if (c.t > 9.5) { G.cine = null; G.state = 'end'; document.exitPointerLock(); $('end').style.display = 'flex';
        const secs = Math.round((performance.now() - G.startTime) / 1000);
        $('endstat').innerHTML = `${Math.round(G.totalClimb)} m climbed<br>${G.falls} fall${G.falls === 1 ? '' : 's'}<br>${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`; }
    }
  }
}

function updateCamera(dt) {
  // fov: dolly-zoom outward as the vertigo takes hold; wide when falling
  const falling = !P.grounded && P.vel.y < -6 ? clamp((-P.vel.y - 6) / 20, 0, 1) : 0;
  const targetFov = 72 + 30 * vertigoS + 22 * falling;
  P.fov = lerp(P.fov, targetFov, 1 - Math.exp(-dt * 2.5));
  camera.fov = P.fov; camera.updateProjectionMatrix();
  // sway: worse with low nerve and high vertigo
  const unease = (1 - P.nerve) * 0.6 + vertigoS * 0.5;
  shakeT += dt * (1.2 + unease * 2);
  const sway = unease * (0.02 + 0.06 * unease);
  const ox = Math.sin(shakeT * 1.7) * sway + Math.sin(shakeT * 4.3) * sway * 0.4;
  const oy = Math.sin(shakeT * 2.9) * sway * 0.6;
  const roll = P.roll + Math.sin(shakeT * 0.9) * unease * 0.05 + (P.stumbleT > 0 ? Math.sin(P.stumbleT * 20) * 0.08 : 0);
  // camera moves slightly forward on vertigo (the classic push-in with the zoom-out)
  camera.position.set(P.pos.x + ox + (-Math.sin(P.yaw)) * vertigoS * 0.25, P.pos.y + EYE + oy - (P.stumbleT > 0 ? 0.25 : 0), P.pos.z + oy * 0.5 + (-Math.cos(P.yaw)) * vertigoS * 0.25);
  camera.rotation.set(P.pitch, P.yaw, roll);
}

function updateLights() {
  // give the point-light pool to the 7 nearest live lamps
  const near = lampSpots.filter(l => l.on).map(l => ({ l, d: (l.x - P.pos.x) ** 2 + (l.y - P.pos.y) ** 2 + (l.z - P.pos.z) ** 2 })).sort((a, b) => a.d - b.d).slice(0, lampPool.length);
  lampPool.forEach((pl, i) => { const n = near[i]; if (n) { pl.position.set(n.l.x, n.l.y, n.l.z); pl.intensity = G.ascent >= 3 ? 0.65 : 0.9; } else pl.intensity = 0; });
}

function updateHud() {
  const alt = P.pos.y + (G.ascent - 1) * TOWER_H;
  $('alt').firstElementChild.textContent = Math.max(0, Math.round(alt));
  const lap = P.groundRef?.slab !== undefined ? SL[P.groundRef.slab].lap + 1 : (P.onRoof ? 'roof' : '');
  $('lap').textContent = lap ? (P.onRoof ? 'roof' : `lap ${lap} / ${Math.ceil(SL.length / 16)}`) : (G.ascent > 1 ? `ascent ${G.ascent}` : '');
  const bar = $('nerve').firstElementChild; bar.style.transform = `scaleX(${P.nerve})`; bar.style.background = P.nerve < 0.35 ? '#e0563c' : '#f2c777';
  $('vig').style.opacity = clamp((1 - P.nerve) * 0.9 + vertigoS * 0.35, 0, 1);
}

function tick() {
  requestAnimationFrame(tick);
  const now = performance.now(); let dt = window.__dt || Math.min(0.05, (now - lastTime) / 1000); lastTime = now; G.t += dt;
  // clouds always move; from the base, that is what makes the tower fall on you
  for (const c of clouds) { c.position.x += c.userData.v * dt * 0.9; c.position.z += c.userData.v * dt * 0.42; if (c.position.x > 380) c.position.x = -380; if (c.position.z > 380) c.position.z = -380; }
  if (G.state === 'title') { P.pitch = SHOT.pitch + Math.sin(G.t * 0.35) * 0.012; P.yaw = SHOT.yaw + Math.sin(G.t * 0.21) * 0.01; }
  if (G.state === 'play' || G.state === 'end') {
    const prevY = P.pos.y;
    if (G.state === 'play') updatePlayer(dt);
    if (G.state === 'play') { if (P.pos.y > prevY && P.grounded) G.totalClimb += P.pos.y - prevY; }
    updateSlabs(dt); updateVertigo(dt); updateGusts(dt); updateNarrative(dt);
  }
  updateCamera(dt); updateLights(); updateHud();
  // audio mix
  if (Audio.ctx) {
    const h = clamp(P.pos.y / TOWER_H, 0, 1);
    const fall = !P.grounded ? clamp(-P.vel.y / 25, 0, 1) : 0;
    const gust = G.gust.phase === 1 ? G.gust.t / 1.1 * 0.5 : G.gust.phase === 2 ? 0.6 * Math.sin(Math.min(1, G.gust.t / 2.6) * Math.PI) + 0.2 : 0;
    Audio.set(0.05 + 0.18 * h + (P.onRoof ? 0.15 : 0) + fall * 0.6, gust, P.inside ? 0.08 : 0.02);
    if (Audio.windFilter) Audio.windFilter.frequency.value = 300 + 500 * fall + 200 * h;
  }
  renderer.render(scene, camera);
}

// ---------------------------------------------------------------- go
loadTower().then(() => {
  G.setupAscent(1);
  renderer.shadowMap.needsUpdate = true;
  G.state = 'title';
  $('loading').style.display = 'none';
  $('fade').style.opacity = 0;
  tick();
}).catch(e => { $('loading').textContent = 'failed to load tower: ' + e; console.error(e); });
</script>
